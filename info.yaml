# Tiny Tapeout project information
project:
  title:        "TinyHash-8"      # Project title
  author:       "JOSE-LUIS CABRA, LUCAS ALEJANDRO PEREZ CHAVARRO, DANIEL-ALBERTO PEREZ CHAVARRO"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "This architecture explores a lightweight alternative for generating values with potential applications in hardware hash functions. It implements an 8-bit ARX mixer that transforms each 8-bit input into a unique 8-bit output. The design implements a permutation of all 256 possible 8-bit values, ensuring a one-to-one mapping without collisions."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_jlcabral_tinyhash_8"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Data_2_Convert[0]"
  ui[1]: "Data_2_Convert[1]"
  ui[2]: "Data_2_Convert[2]"
  ui[3]: "Data_2_Convert[3]"
  ui[4]: "Data_2_Convert[4]"
  ui[5]: "Data_2_Convert[5]"
  ui[6]: "Data_2_Convert[6]"
  ui[7]: "Data_2_Convert[7]"

  # Outputs
  uo[0]: "TinyHash[0]"
  uo[1]: "TinyHash[1]"
  uo[2]: "TinyHash[2]"
  uo[3]: "TinyHash[3]"
  uo[4]: "TinyHash[4]"
  uo[5]: "TinyHash[5]"
  uo[6]: "TinyHash[6]"
  uo[7]: "TinyHash[7]"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
